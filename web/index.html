<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Credit-Card Default – Reproducibility Dashboard</title>

  <!-- Bootstrap for layout & spacing -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Plotly for interactive charts -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">

  <header class="bg-primary text-white py-3 mb-4">
    <div class="container">
      <h1 class="h3 mb-0">Credit-Card Default – Reproducibility Dashboard</h1>
    </div>
  </header>

  <main class="container">

    <!-- ==== Controls ==== -->
    <section class="mb-4">
      <label for="modelSelect" class="form-label fw-bold">Select model:</label>
      <select id="modelSelect" class="form-select w-25"></select>
    </section>

    <!-- ==== Metrics (cards) ==== -->
    <section class="row g-3 mb-4" id="metricCards">
      <!-- cards will be injected by app.js -->
    </section>

    <!-- ==== Charts ==== -->
    <section class="row g-4">

      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">PR‑AUC</h5>
            <div id="chart-auc"></div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Log‑Loss</h5>
            <div id="chart-logloss"></div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Cost (r = 5)</h5>
            <div id="chart-cost"></div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Fairness – FAR / MDR</h5>
            <div id="chart-fairness"></div>
          </div>
        </div>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
