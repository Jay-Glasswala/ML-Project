# Runs the whole project on GitHub's servers after every push:
# downloads the data, trains and evaluates everything (run_all.py), then runs
# all the tests, including the check that the website's JavaScript predictor
# gives the same probabilities as scikit-learn (needs Node.js).
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run the full pipeline (downloads the data, trains, evaluates)
        run: python run_all.py

      - name: Run all tests
        run: pytest -v -rs
